<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comic30 Video Candidates</title>
    <style>
      body {
        margin: 0;
        background: #05090d;
        color: #f7f7f7;
        font-family: Arial, Helvetica, sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 18px 24px;
        background: rgba(5, 9, 13, 0.92);
        border-bottom: 1px solid rgba(255, 138, 42, 0.45);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      p {
        margin: 8px 0 0;
        color: #aab4bf;
      }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 18px;
        padding: 18px;
      }

      article {
        position: relative;
        background: #0a1218;
        border: 1px solid rgba(55, 196, 255, 0.32);
      }

      article b {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 1;
        padding: 8px 10px;
        background: rgba(1, 7, 12, 0.82);
        color: #fff;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #000;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Comic30 running robot candidate clips</h1>
      <p>Temporary review screen for identifying the original robot-running video.</p>
    </header>
    <main>
      <article><b>robot-section-background</b><video controls muted loop playsinline src="/assets/videos/user/robot-section-background.mp4"></video></article>
      <article><b>robot-branching-logic</b><video controls muted loop playsinline src="/assets/videos/user/robot-branching-logic.mp4"></video></article>
      <article><b>robot-run-candidate-a</b><video controls muted loop playsinline src="/assets/videos/user/robot-run-candidate-a.mp4"></video></article>
      <article><b>robot-run-candidate-b</b><video controls muted loop playsinline src="/assets/videos/user/robot-run-candidate-b.mp4"></video></article>
      <article><b>asset-1-2-loop</b><video controls muted loop playsinline src="/assets/videos/probe/asset-1-2-loop.mp4"></video></article>
      <article><b>asset-3-loop</b><video controls muted loop playsinline src="/assets/videos/probe/asset-3-loop.mp4"></video></article>
      <article><b>demo-clips</b><video controls muted loop playsinline src="/assets/videos/probe/demo-clips.mp4"></video></article>
      <article><b>demo-clips-2</b><video controls muted loop playsinline src="/assets/videos/probe/demo-clips-2.mp4"></video></article>
    </main>
  </body>
</html>
